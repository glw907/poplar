StylesPath = .vale/styles
Packages = https://github.com/glw907/survey/releases/download/v1.1.0/Survey.zip
MinAlertLevel = suggestion

# Comment-scoped linting: extract Go comment text and lint it as Markdown.
[formats]
go = md

# Go comments: the house overlay. The em dash stays banned (no opt-out section).
# Vale lints only the comment text and ignores code tokens.
[*.go]
BasedOnStyles = Survey

# Judgment over-fires on legitimate technical vocabulary (a "dedicated" icon, a
# "comprehensive" test), so keep it advisory here rather than a gate blocker,
# pending the canonical Survey audience-based level rework.
Survey.Judgment = warning

# The docs/**/*.md to Google + Survey mapping arrives with the prose arm (plan 06).
# It is left out here on purpose so this arm stays scoped to Go comments.
